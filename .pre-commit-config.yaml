---

default_stages: [pre-commit]

exclude: ^\.beads/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: \.jinja$
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^docs/asks/
      - id: trailing-whitespace
        exclude: ^docs/asks/
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: (^|/)uv\.lock$
      - id: detect-private-key
        exclude: ^(tests?/fixtures/|docs/examples?/)
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: ^(\.claude/|\.githooks/|node_modules/|docs/research/)



  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: validate-claude-settings
        name: validate .claude/settings.json hook script refs exist
        entry: validate-claude-settings
        language: system
        pass_filenames: false
        always_run: true
      - id: comment-ratchet
        name: comment ratchet (no new code comments; comment-baseline.json only shrinks)
        entry: python3 scripts/comment_ratchet.py
        language: system

      - id: npm-test
        name: npm test (Vitest repository checks, then claude plugin test plugins/doc-editor)
        entry: npm test
        verbose: true
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: npm run typecheck (the repository, the core with no DOM or Node types, the hooks)
        entry: npm run typecheck
        verbose: true
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true
      - id: plugin-declared
        name: claude plugin validate --json plugins/doc-editor matches the README's declared list
        entry: node scripts/check-plugin-declared.mjs plugins/doc-editor
        verbose: true
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true
      - id: marketplace-validate
        name: claude plugin validate . (the marketplace lists ./plugins/doc-editor)
        entry: node scripts/check-marketplace.mjs . ./plugins/doc-editor
        verbose: true
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true
      - id: plugin-size
        name: no tracked or staged file under plugins/doc-editor over 1 MB
        entry: node scripts/check-plugin-size.mjs plugins/doc-editor
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true

      - id: test-gate
        name: test gate (mise-aware, tech-stack auto-detect)
        entry: test-gate
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: bd-precommit-validate
        name: bd dual-ID invariant (a staged .beads/issues.jsonl mirror, if tracked)
        entry: bd-precommit-validate
        language: system
        pass_filenames: false
        always_run: true
      - id: bd-blocked-comment
        name: every blocked Beads issue carries its transition comment
        entry: bash -c 'bd-blocked-check --current-repo --stage; rc=$?; if [ "$rc" -eq 2 ]; then exit 0; fi; exit "$rc"'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: public-repo-name-check
        name: no employer infrastructure names in a public repo
        entry: public-repo-name-check
        language: system
        stages: [pre-commit]
        types: [text]
        exclude: ^docs/asks/
